version: "3.9"

services:
  app:
    build: .
    container_name: express_app
    ports:
      - "5000:5000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      PORT: 5000
      # Override the local DB URL to point to the 'db' container instead of 'localhost'
      DATABASE_URL: postgres://${PGUSER:-kali}:${PGPASSWORD:-kali}@db:5432/${PGDATABASE:-voting_backend}
    depends_on:
      - db
    command: >
      sh -c "
        until pg_isready -h db -U $${PGUSER:-kali}; do
          echo 'Waiting for postgres...';
          sleep 2;
        done;
        npm run dev
      "
    networks:
      - app-network

  db:
    image: postgres:17
    container_name: postgres_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: ${PGDATABASE:-voting_backend}
      POSTGRES_USER: ${PGUSER:-kali}
      POSTGRES_PASSWORD: ${PGPASSWORD:-kali}
    ports:
      - "5433:5432" # Host port 5433 maps to Container port 5432
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network: